<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subscribe — MoonStar Studio</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/home-v2.css">
<style>
  .sub-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:6vh 5vw; background:var(--bone); }
  .sub-card { width:100%; max-width:460px; background:#fff; border:1px solid var(--hair-ink); border-radius:18px; padding:30px 26px; box-shadow:0 24px 60px -30px rgba(22,21,19,.4); }
  .sub-brand { font-family:var(--mono); font-size:11px; letter-spacing:.16em; display:inline-flex; align-items:center; gap:9px; color:var(--ink); }
  .sub-brand i { width:7px; height:7px; border-radius:50%; background:var(--red); display:inline-block; }
  .sub-plan { margin:18px 0 22px; padding:16px; border:1px solid var(--hair-ink); border-radius:12px; background:var(--bone); }
  .sub-plan h2 { margin:0; font-size:22px; letter-spacing:-.02em; }
  .sub-plan .price { font-family:var(--mono); color:var(--red); font-size:14px; margin-top:4px; }
  .sub-plan ul { margin:12px 0 0; padding-left:18px; font-size:13px; line-height:1.7; color:#444; }
  .sub-field { display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
  .sub-field label { font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:rgba(22,21,19,.6); }
  .sub-field input { font-family:var(--arch); font-size:16px; padding:12px 14px; border:1px solid var(--hair-ink); border-radius:10px; }
  .sub-field input:focus { outline:none; border-color:var(--red); }
  .sub-err { font-family:var(--mono); font-size:12px; color:var(--red); min-height:0; margin-bottom:10px; }
  .sub-err:empty { display:none; }
  .sub-btn { width:100%; padding:15px; border:1px solid var(--ink); background:var(--ink); color:var(--bone); font-family:var(--mono); font-size:12px; letter-spacing:.16em; text-transform:uppercase; border-radius:10px; cursor:pointer; }
  .sub-btn:hover { background:var(--red); border-color:var(--red); }
  .sub-btn:disabled { opacity:.5; cursor:default; }
  .sub-note { margin:14px 0 0; font-family:var(--mono); font-size:11px; line-height:1.6; color:rgba(22,21,19,.5); text-align:center; }
  .sub-back { display:block; text-align:center; margin-top:16px; font-family:var(--mono); font-size:11px; color:rgba(22,21,19,.5); text-decoration:none; }
</style>
</head>
<body class="sub-wrap">
  <div class="sub-card">
    <div class="sub-brand"><i></i> MOONSTAR STUDIO · CARE PLAN</div>
    <div class="sub-plan" id="sub-plan"><h2 id="p-name">Loading…</h2><div class="price" id="p-price"></div><ul id="p-feats"></ul></div>
    <form id="sub-form">
      <div class="sub-field"><label for="s-name">Full name</label><input type="text" id="s-name" autocomplete="name" required></div>
      <div class="sub-field"><label for="s-email">Email</label><input type="email" id="s-email" autocomplete="email" required></div>
      <div class="sub-field"><label for="s-phone">Phone</label><input type="tel" id="s-phone" autocomplete="tel" required></div>
      <div class="sub-err" id="s-err"></div>
      <button class="sub-btn" id="s-btn" type="submit">Continue to secure payment</button>
      <p class="sub-note">Secure payment by ABA PayWay. Billed monthly. Cancel anytime.</p>
    </form>
    <a class="sub-back" href="/services">← Back to plans</a>
  </div>
<script src="/js/subscribe.js"></script>
</body>
</html>
