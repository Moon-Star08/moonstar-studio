<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subscribe — MoonStar Studio</title>
<meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/home-v2.css">
<style>
  .sub-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:6vh 5vw;
    background:linear-gradient(rgba(217,51,63,.58), rgba(138,18,23,.84)), url('/images/subscribe-bg.jpg') center/cover no-repeat fixed; }
  .sub-card { width:100%; max-width:460px; background:#fff; border:1px solid rgba(22,21,19,.14); border-radius:0; padding:34px 28px;
    box-shadow:0 44px 100px -30px rgba(0,0,0,.6);
    transition:transform .55s var(--ease), box-shadow .55s var(--ease); will-change:transform; }
  .sub-card:hover { transform:translateY(-10px); box-shadow:0 64px 130px -40px rgba(0,0,0,.72); }
  .sub-brand { font-family:var(--mono); font-size:11px; letter-spacing:.16em; display:inline-flex; align-items:center; gap:9px; color:var(--ink); }
  .sub-brand i { width:7px; height:7px; border-radius:50%; background:var(--red); display:inline-block; animation:pulse 2.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { box-shadow:0 0 0 0 rgba(217,51,63,.5); } 50% { box-shadow:0 0 0 6px rgba(217,51,63,0); } }
  .sub-plan { position:relative; overflow:hidden; margin:18px 0 22px; padding:16px 16px 16px 18px; border:1px solid var(--hair-ink); border-radius:0; background:var(--bone); transition:background .4s var(--ease); }
  .sub-plan::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--red); transform:scaleY(0); transform-origin:top; transition:transform .55s var(--ease); }
  .sub-card:hover .sub-plan { background:#fff; }
  .sub-card:hover .sub-plan::before { transform:scaleY(1); }
  .sub-plan h2 { margin:0; font-size:22px; letter-spacing:-.02em; transition:transform .45s var(--ease); }
  .sub-card:hover .sub-plan h2 { transform:translateX(4px); }
  .sub-plan .price { font-family:var(--mono); color:var(--red); font-size:14px; margin-top:4px; }
  .sub-plan ul { margin:12px 0 0; padding-left:18px; font-size:13px; line-height:1.7; color:#666; }
  .sub-plan li { transition:color .4s var(--ease); }
  .sub-card:hover .sub-plan li { color:var(--ink); }
  .sub-field { display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
  .sub-field label { font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:rgba(22,21,19,.6); }
  .sub-field input { font-family:var(--arch); font-size:16px; padding:12px 14px; border:1px solid var(--hair-ink); border-radius:0; transition:border-color .25s, box-shadow .25s, transform .25s; }
  .sub-field input:focus { outline:none; border-color:var(--red); box-shadow:0 0 0 3px rgba(217,51,63,.12); transform:translateY(-1px); }
  .sub-err { font-family:var(--mono); font-size:12px; color:var(--red); min-height:0; margin-bottom:10px; }
  .sub-err:empty { display:none; }
  .sub-btn { position:relative; overflow:hidden; isolation:isolate; width:100%; padding:15px; border:1px solid var(--ink); background:var(--ink); color:var(--bone); font-family:var(--mono); font-size:12px; letter-spacing:.16em; text-transform:uppercase; border-radius:0; cursor:pointer; transition:border-color .3s; }
  .sub-btn::before { content:""; position:absolute; inset:0; z-index:-1; background:var(--red); transform:scaleX(0); transform-origin:right; transition:transform .5s var(--ease); }
  .sub-btn:hover { border-color:var(--red); }
  .sub-btn:hover::before { transform:scaleX(1); transform-origin:left; }
  .sub-btn:disabled { opacity:.5; cursor:default; }
  .sub-note { margin:14px 0 0; font-family:var(--mono); font-size:11px; line-height:1.6; color:rgba(22,21,19,.5); text-align:center; }
  .sub-back { display:block; text-align:center; margin-top:16px; font-family:var(--mono); font-size:11px; color:rgba(22,21,19,.5); text-decoration:none; }
  .sub-back:hover { color:var(--red); }
</style>
</head>
<body class="sub-wrap">
  <div class="sub-card">
    <div class="sub-brand"><i></i> MOONSTAR STUDIO · CARE PLAN</div>
    <div class="sub-plan" id="sub-plan"><h2 id="p-name">Loading…</h2><div class="price" id="p-price"></div><ul id="p-feats"></ul></div>
    <form id="sub-form">
      <div class="sub-field"><label for="s-name">Full name</label><input type="text" id="s-name" autocomplete="name" required></div>
      <div class="sub-field"><label for="s-email">Email</label><input type="email" id="s-email" autocomplete="email" required></div>
      <div class="sub-field"><label for="s-phone">Phone</label><input type="tel" id="s-phone" autocomplete="tel" required></div>
      <div class="sub-err" id="s-err"></div>
      <button class="sub-btn" id="s-btn" type="submit">Continue to secure payment</button>
      <p class="sub-note">Secure payment by ABA PayWay. Billed monthly. Cancel anytime.</p>
    </form>
    <a class="sub-back" href="/services">← Back to plans</a>
  </div>
<script src="/js/subscribe.js"></script>
</body>
</html>
