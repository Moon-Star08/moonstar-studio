<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Subscription — MoonStar Studio</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/home-v2.css">
<style>
  .acc-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:6vh 5vw;
    background:linear-gradient(rgba(217,51,63,.58), rgba(138,18,23,.84)), url('/images/subscribe-bg.jpg') center/cover no-repeat fixed; }
  .acc-card { width:100%; max-width:520px; background:#fff; border:1px solid rgba(22,21,19,.14); border-radius:0; padding:34px 28px;
    box-shadow:0 44px 100px -30px rgba(0,0,0,.6); }
  .acc-brand { font-family:var(--mono); font-size:11px; letter-spacing:.16em; display:inline-flex; align-items:center; gap:9px; color:var(--ink); }
  .acc-brand i { width:7px; height:7px; border-radius:50%; background:var(--red); display:inline-block; animation:pulse 2.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { box-shadow:0 0 0 0 rgba(217,51,63,.5); } 50% { box-shadow:0 0 0 6px rgba(217,51,63,0); } }
  .acc-h { margin:16px 0 4px; font-size:26px; letter-spacing:-.02em; }
  .acc-sub { font-family:var(--mono); font-size:12px; color:rgba(22,21,19,.55); margin:0 0 22px; line-height:1.6; }
  .acc-field { display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
  .acc-field label { font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:rgba(22,21,19,.6); }
  .acc-field input { font-family:var(--arch); font-size:16px; padding:12px 14px; border:1px solid var(--hair-ink); border-radius:0; transition:border-color .25s, box-shadow .25s, transform .25s; }
  .acc-field input:focus { outline:none; border-color:var(--red); box-shadow:0 0 0 3px rgba(217,51,63,.12); transform:translateY(-1px); }
  .acc-btn { position:relative; overflow:hidden; isolation:isolate; width:100%; padding:15px; border:1px solid var(--ink); background:var(--ink); color:var(--bone); font-family:var(--mono); font-size:12px; letter-spacing:.16em; text-transform:uppercase; border-radius:0; cursor:pointer; transition:border-color .3s; }
  .acc-btn::before { content:""; position:absolute; inset:0; z-index:-1; background:var(--red); transform:scaleX(0); transform-origin:right; transition:transform .5s var(--ease); }
  .acc-btn:hover { border-color:var(--red); }
  .acc-btn:hover::before { transform:scaleX(1); transform-origin:left; }
  .acc-btn:disabled { opacity:.5; cursor:default; }
  .acc-msg { font-family:var(--mono); font-size:12px; line-height:1.6; min-height:0; margin:12px 0 0; }
  .acc-msg:empty { display:none; }
  .acc-msg.err { color:var(--red); }
  .acc-msg.ok { color:#1a7f37; }
  .acc-back { display:block; text-align:center; margin-top:18px; font-family:var(--mono); font-size:11px; color:rgba(22,21,19,.5); text-decoration:none; }
  .acc-back:hover { color:var(--red); }

  /* signed-in list */
  .acc-row-top { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:6px; }
  .acc-email { font-family:var(--mono); font-size:11px; color:rgba(22,21,19,.55); word-break:break-all; }
  .acc-logout { font-family:var(--mono); font-size:11px; color:rgba(22,21,19,.5); background:none; border:none; cursor:pointer; text-decoration:underline; }
  .acc-logout:hover { color:var(--red); }
  .plan-card { position:relative; overflow:hidden; border:1px solid var(--hair-ink); border-radius:0; background:var(--bone); padding:18px 18px 18px 20px; margin-bottom:14px; }
  .plan-card::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--red); }
  .plan-card.is-cancelled::before, .plan-card.is-inactive::before { background:rgba(22,21,19,.28); }
  .plan-top { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .plan-name { margin:0; font-size:20px; letter-spacing:-.02em; }
  .plan-price { font-family:var(--mono); color:var(--red); font-size:13px; margin-top:3px; }
  .badge { font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; padding:5px 10px; border-radius:0; white-space:nowrap; }
  .badge.active { background:rgba(26,127,55,.12); color:#1a7f37; border:1px solid rgba(26,127,55,.4); }
  .badge.pending { background:rgba(217,51,63,.1); color:var(--red); border:1px solid rgba(217,51,63,.35); }
  .badge.cancelled, .badge.other { background:rgba(22,21,19,.07); color:rgba(22,21,19,.6); border:1px solid rgba(22,21,19,.2); }
  .plan-meta { font-family:var(--mono); font-size:11px; color:rgba(22,21,19,.55); margin:12px 0 0; line-height:1.7; }
  .cancel-btn { margin-top:14px; font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; padding:9px 16px; background:#fff; color:var(--ink); border:1px solid var(--hair-ink); border-radius:0; cursor:pointer; transition:border-color .25s, color .25s; }
  .cancel-btn:hover { border-color:var(--red); color:var(--red); }
  .cancel-btn:disabled { opacity:.5; cursor:default; }
  .acc-empty { font-family:var(--mono); font-size:12px; color:rgba(22,21,19,.55); line-height:1.7; }
  .hidden { display:none !important; }
</style>
</head>
<body class="acc-wrap">
  <div class="acc-card">
    <div class="acc-brand"><i></i> MOONSTAR STUDIO · MY ACCOUNT</div>

    <!-- signed-out: request magic link -->
    <div id="view-login">
      <h1 class="acc-h">View my subscription</h1>
      <p class="acc-sub">Enter the email you subscribed with. We'll send you a secure sign-in link — no password needed.</p>
      <form id="login-form">
        <div class="acc-field"><label for="l-email">Email</label><input type="email" id="l-email" autocomplete="email" required></div>
        <button class="acc-btn" id="l-btn" type="submit">Send me a sign-in link</button>
        <div class="acc-msg" id="l-msg"></div>
      </form>
      <a class="acc-back" href="/">← Back to MoonStar Studio</a>
    </div>

    <!-- signed-in: subscriptions -->
    <div id="view-account" class="hidden">
      <div class="acc-row-top">
        <h1 class="acc-h" style="margin:16px 0 0;">My subscription</h1>
        <button class="acc-logout" id="logout-btn" type="button">Sign out</button>
      </div>
      <p class="acc-email" id="acc-email"></p>
      <div id="plans" style="margin-top:18px;"></div>
      <div class="acc-msg" id="a-msg"></div>
      <a class="acc-back" href="/">← Back to MoonStar Studio</a>
    </div>

    <div id="view-loading">
      <p class="acc-sub" style="margin-top:20px;">Loading…</p>
    </div>
  </div>
<script src="/js/portal.js"></script>
</body>
</html>
