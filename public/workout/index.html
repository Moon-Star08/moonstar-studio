<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Workout — MoonStar</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#161513">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/home-v2.css">
<link rel="stylesheet" href="/css/workout.css">
</head>
<body class="wk-body">

<header class="wk-top">
  <div class="wk-top__brand"><span class="wk-dot"></span> MOONSTAR &middot; WORKOUT</div>
  <div class="wk-top__right">
    <span id="wkProgress" class="wk-progress">0 / 100</span>
    <a class="wk-btn" href="/">Site</a>
    <button class="wk-btn" id="wkLogout" type="button">Log out</button>
  </div>
</header>

<main class="wk-main">
  <div class="wk-head">
    <span class="wk-kicker">// 100-day plan</span>
    <h1 id="wkTitle">Let's go.</h1>
    <p class="wk-sub">Tap a day for the workout and food. Tap an exercise for a how-to video.</p>
    <div class="wk-legend">
      <span><i class="wk-lg wk-lg--work"></i> Workout</span>
      <span><i class="wk-lg wk-lg--rest"></i> Rest</span>
      <span><i class="wk-lg wk-lg--done"></i> Done</span>
      <span><i class="wk-lg wk-lg--today"></i> Today</span>
    </div>
  </div>

  <div class="wk-cal" id="wkCal"></div>
</main>

<!-- Day detail drawer -->
<div class="wk-drawer" id="wkDrawer" hidden>
  <div class="wk-drawer__scrim" data-close="1"></div>
  <div class="wk-drawer__panel" id="wkPanel" role="dialog" aria-label="Day detail"></div>
</div>

<!-- Video modal -->
<div class="wk-modal" id="wkVideo" hidden>
  <div class="wk-modal__scrim" data-close="1"></div>
  <div class="wk-modal__box" role="dialog" aria-label="How-to video">
    <div class="wk-modal__bar">
      <span class="wk-modal__title" id="wkVideoTitle"></span>
      <button class="wk-modal__close" id="wkVideoClose" type="button" aria-label="Close">&times;</button>
    </div>
    <div class="wk-modal__frame" id="wkVideoFrame"></div>
  </div>
</div>

<script src="/js/workout-plan.js"></script>
<script src="/js/workout.js"></script>
</body>
</html>
