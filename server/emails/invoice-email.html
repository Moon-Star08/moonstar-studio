<!--
  Invoice delivery email (sent from the admin Send Invoice page).
  Placeholders: {{name}} {{title}} {{message_html}} {{year}}.
  The invoice file(s) ride along as real email attachments.
  Same brand style as the thank-you email.
-->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <title>Your invoice</title>
</head>
<body style="margin:0; padding:0; background:#e9e5dc; font-family:Arial,Helvetica,sans-serif; color:#161513;">
  <div style="display:none; max-height:0; overflow:hidden; opacity:0;">Your invoice from MoonStar Studio is attached.</div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#e9e5dc;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:600px; max-width:600px; background:#f4f1ea; border-radius:16px; overflow:hidden; border:1px solid rgba(22,21,19,0.12);">

          <!-- HEADER banner -->
          <tr>
            <td align="center" style="background:#a3161b; padding:0; line-height:0; font-size:0;">
              <img src="https://moonstarstudio.site/img/email/header.jpg" alt="MoonStar Studio" width="600" style="display:block; width:100%; max-width:600px; height:auto; border:0;">
            </td>
          </tr>

          <!-- BODY -->
          <tr>
            <td style="padding:40px 32px 8px;">
              <p style="margin:0 0 10px; font-size:12px; letter-spacing:2px; text-transform:uppercase; color:#d9333f;">Invoice</p>
              <h1 style="margin:0; font-family:'Arial Black',Arial,Helvetica,sans-serif; font-size:30px; line-height:1.15; letter-spacing:-0.5px; color:#161513;">
                Hi {{name}}, here's your invoice.
              </h1>
              <p style="margin:22px 0 0; font-size:16px; line-height:1.7; color:#333333;">{{message_html}}</p>
              <div style="margin:22px 0 0; background:#ffffff; border-left:3px solid #d9333f; border-radius:0 8px 8px 0; padding:14px 18px;">
                <p style="margin:0; font-size:12px; letter-spacing:1px; text-transform:uppercase; color:#888888;">Attached</p>
                <p style="margin:6px 0 0; font-size:16px; font-weight:bold; color:#161513;">📎 {{title}}</p>
                <p style="margin:4px 0 0; font-size:13px; color:#888888;">See the attachment(s) on this email.</p>
              </div>
            </td>
          </tr>

          <!-- divider -->
          <tr><td style="padding:30px 32px 0;"><div style="height:1px; background:rgba(22,21,19,0.12);"></div></td></tr>

          <!-- FOOTER -->
          <tr>
            <td align="center" style="padding:24px 32px 34px;">
              <img src="https://moonstarstudio.site/img/email/torii.png" alt="" width="150" style="display:block; margin:0 auto 14px; width:150px; max-width:100%; height:auto; border:0;">
              <p style="margin:0 0 10px; font-size:13px; color:#161513;">
                <a href="https://moonstarstudio.site" style="color:#161513; text-decoration:none;">moonstarstudio.site</a>
                &nbsp;|&nbsp;
                <a href="mailto:moonstarstudio.co@gmail.com" style="color:#161513; text-decoration:none;">moonstarstudio.co@gmail.com</a>
              </p>
              <p style="margin:0 0 18px; font-size:12px; color:#777777;">{{year}} &copy; MoonStar Studio</p>
              <table role="presentation" cellpadding="0" cellspacing="0" align="center"><tr>
                <td style="padding:0 5px;"><a href="https://www.linkedin.com/in/moon-star-768154425"><table role="presentation" cellpadding="0" cellspacing="0"><tr><td width="40" height="40" align="center" valign="middle" style="width:40px;height:40px;background:#d9333f;border-radius:50%;"><img src="https://moonstarstudio.site/img/email/in.png" alt="LinkedIn" width="20" height="20" style="display:inline-block;border:0;"></td></tr></table></a></td>
                <td style="padding:0 5px;"><a href="https://www.instagram.com/moonstar.studio.co"><table role="presentation" cellpadding="0" cellspacing="0"><tr><td width="40" height="40" align="center" valign="middle" style="width:40px;height:40px;background:#d9333f;border-radius:50%;"><img src="https://moonstarstudio.site/img/email/ig.png" alt="Instagram" width="20" height="20" style="display:inline-block;border:0;"></td></tr></table></a></td>
                <td style="padding:0 5px;"><a href="https://www.tiktok.com/@moonstarstudio.co"><table role="presentation" cellpadding="0" cellspacing="0"><tr><td width="40" height="40" align="center" valign="middle" style="width:40px;height:40px;background:#d9333f;border-radius:50%;"><img src="https://moonstarstudio.site/img/email/tt.png" alt="TikTok" width="20" height="20" style="display:inline-block;border:0;"></td></tr></table></a></td>
                <td style="padding:0 5px;"><a href="https://www.facebook.com/share/17haycQPn3/"><table role="presentation" cellpadding="0" cellspacing="0"><tr><td width="40" height="40" align="center" valign="middle" style="width:40px;height:40px;background:#d9333f;border-radius:50%;"><img src="https://moonstarstudio.site/img/email/fb.png" alt="Facebook" width="20" height="20" style="display:inline-block;border:0;"></td></tr></table></a></td>
              </tr></table>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
